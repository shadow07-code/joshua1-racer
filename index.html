<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f380f" />
  <meta name="description" content="Joshua 1 Racer — an 8-bit GameBoy-style top-down racer. Tap to play." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Joshua1" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <!-- apple-touch-icon.png is optional; generate via tools/generate-icons.html for older iOS -->
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <title>Joshua 1 Racer</title>
  <style>
    :root {
      --dmg-darkest: #0f380f;
      --dmg-dark:    #306230;
      --dmg-light:   #8bac0f;
      --dmg-lightest:#9bbc0f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--dmg-darkest);
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      font-family: ui-monospace, "Courier New", monospace;
      color: var(--dmg-lightest);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    /* Stage fills the entire viewport so the game runs edge-to-edge. */
    #stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      flex: 1 1 auto;
      min-height: 0;
    }
    canvas#game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: var(--dmg-darkest);
      display: block;
      width: 100%;
      height: 100%;
      /* The backing store matches the device aspect (see config.js), so contain
         fills the screen with no bars; contain guarantees no distortion if the
         aspect ever drifts (e.g. on rotate). */
      object-fit: contain;
    }
    /* PWA install banner */
    #install-banner {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      background: var(--dmg-darkest);
      color: var(--dmg-lightest);
      border: 2px solid var(--dmg-light);
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.3;
      display: none;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 24px);
      z-index: 10;
      letter-spacing: 1px;
    }
    #install-banner.show { display: flex; }
    #install-banner button {
      background: var(--dmg-light);
      color: var(--dmg-darkest);
      border: 2px solid var(--dmg-lightest);
      padding: 4px 8px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
    }
    #install-banner button.ghost {
      background: transparent;
      color: var(--dmg-lightest);
      border-color: var(--dmg-dark);
    }
    #install-banner .msg { flex: 1; }
    /* Mute / pause — small translucent overlay in the top-right corner so it
       never steals screen real estate from the game. */
    #toolbar {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 6px);
      right: calc(env(safe-area-inset-right) + 6px);
      display: flex;
      gap: 8px;
      z-index: 9;
    }
    #toolbar button {
      background: rgba(15, 56, 15, 0.78);
      color: var(--dmg-lightest);
      border: 2px solid var(--dmg-light);
      width: 38px;
      height: 34px;
      font: inherit;
      font-size: 17px;
      cursor: pointer;
      letter-spacing: 1px;
      border-radius: 5px;
    }
    #toolbar button:active { background: rgba(139, 172, 15, 0.85); color: #0f380f; }
    /* Dimmed look when a channel is toggled OFF. */
    #toolbar button.off { opacity: 0.4; border-color: var(--dmg-dark); }
    /* Enlarged, easy-to-tap toggles during gameplay; nudged below the score strip. */
    #toolbar.playing {
      top: calc(env(safe-area-inset-top) + 30px);
      gap: 10px;
    }
    #toolbar.playing button {
      width: 52px;
      height: 46px;
      font-size: 24px;
      border-width: 3px;
      border-radius: 7px;
    }
    /* One-thumb steering — a FLOATING JOYSTICK. The container is an invisible
       touch surface over the lower band; touching anywhere in it pops the
       joystick up under the thumb. Steering is binary: push past the centre
       deadzone and the car commits fully left or right (no analog gradient). */
    #steer-controls {
      position: fixed; left: 0; right: 0; bottom: 0; top: 45%;
      display: none; z-index: 8; touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #steer-controls.show { display: block; }
    /* Floating joystick base — input.js positions it under the touch point. */
    #steer-stick {
      position: fixed; display: none;
      width: 132px; height: 132px;
      transform: translate(-50%, -50%);
      background: rgba(15, 56, 15, 0.45);
      border: 3px solid rgba(155, 188, 15, 0.85);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }
    #steer-stick.show { display: block; }
    /* Left / right direction arrows inside the ring. */
    #steer-stick::after {
      content: "\25C0        \25B6"; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; color: rgba(155, 188, 15, 0.50);
      font-size: 15px; line-height: 1; letter-spacing: 0;
    }
    #steer-knob {
      position: absolute; left: 50%; top: 50%;
      width: 56px; height: 56px;
      transform: translate(-50%, -50%);
      background: rgba(155, 188, 15, 0.92);
      border: 3px solid #0f380f;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
    /* Permanent "add to phone" button — shown centred above "TAP TO START"
       on the title screen only. Bottom offset set dynamically by pwa.js. */
    #btn-install {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 50%;                     /* fallback; JS overrides per canvas scale */
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(15, 56, 15, 0.85);
      color: var(--dmg-lightest);
      border: 2px solid var(--dmg-light);
      border-radius: 6px;
      padding: 10px 18px;
      font: inherit;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      white-space: nowrap;
      cursor: pointer;
      z-index: 9;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-install.show { display: inline-flex; }
    #btn-install:active { background: rgba(139, 172, 15, 0.9); color: #0f380f; }

    /* Title LEADERBOARD button — stacked just above the install button.
       Vertical position is set by ui.js per canvas scale. */
    #btn-leaderboard {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 56%;                     /* fallback; JS overrides */
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(15, 56, 15, 0.85);
      color: var(--dmg-lightest);
      border: 2px solid var(--dmg-light);
      border-radius: 6px;
      padding: 10px 18px;
      font: inherit;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      white-space: nowrap;
      cursor: pointer;
      z-index: 9;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-leaderboard.show { display: inline-flex; }
    #btn-leaderboard:active { background: rgba(139, 172, 15, 0.9); color: #0f380f; }

    /* Modal panels — name entry + leaderboard. */
    .panel {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 11;
      background: rgba(15, 56, 15, 0.55);
    }
    .panel.show { display: flex; }
    .panel-box {
      width: 100%;
      max-width: 280px;
      max-height: 90%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--dmg-darkest);
      border: 3px solid var(--dmg-light);
      border-radius: 8px;
      padding: 14px;
    }
    .panel-title {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--dmg-lightest);
    }
    #name-input {
      width: 100%;
      text-align: center;
      text-transform: uppercase;
      font: inherit;
      font-size: 20px;
      letter-spacing: 4px;
      padding: 10px 8px;
      background: #0a280a;
      color: var(--dmg-lightest);
      border: 2px solid var(--dmg-light);
      border-radius: 6px;
      outline: none;
    }
    .panel-row { display: flex; gap: 10px; justify-content: center; }
    .btn-go, .btn-ghost {
      flex: 1;
      font: inherit;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      padding: 11px 8px;
      border-radius: 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-go {
      background: var(--dmg-light);
      color: var(--dmg-darkest);
      border: 2px solid var(--dmg-lightest);
    }
    .btn-go:active { background: var(--dmg-lightest); }
    .btn-ghost {
      background: transparent;
      color: var(--dmg-lightest);
      border: 2px solid var(--dmg-dark);
    }
    .btn-ghost:active { background: var(--dmg-dark); color: var(--dmg-darkest); }

    /* Leaderboard list. */
    .lb-status {
      display: none;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--dmg-light);
    }
    .lb-status.show { display: block; }
    .lb-list {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 0;
    }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--dmg-lightest);
      border-bottom: 1px solid rgba(139, 172, 15, 0.18);
    }
    .lb-row.me { background: var(--dmg-dark); border-radius: 4px; }
    .lb-rank { color: var(--dmg-light); min-width: 20px; }
    .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { font-variant-numeric: tabular-nums; }

    /* Game-over action bar — pinned to the bottom of the viewport. */
    #gameover-actions {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 10px);
      width: calc(100% - 24px);
      max-width: 300px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    #gameover-actions.show { display: flex; }
    #gameover-actions .btn-go, #gameover-actions .btn-ghost { flex: none; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-music" title="Music on/off (M)" aria-label="Toggle music">♪</button>
    <button id="btn-sfx" title="Sound effects on/off" aria-label="Toggle sound effects">🔊</button>
  </div>

  <!-- One-thumb floating steering joystick (shown during gameplay; wired by input.js) -->
  <div id="steer-controls" aria-hidden="true">
    <div id="steer-stick"><div id="steer-knob"></div></div>
  </div>

  <button id="btn-install" aria-label="Install game for offline play">📲 ADD TO HOME SCREEN</button>
  <button id="btn-leaderboard" aria-label="View the leaderboard">🏆 LEADERBOARD</button>

  <div id="stage">
    <canvas id="game" width="160" height="240"></canvas>
  </div>

  <div id="install-banner" role="dialog" aria-label="Install Joshua 1 Racer">
    <span class="msg" id="install-msg">📲 ADD TO HOME SCREEN — PLAY OFFLINE</span>
    <button id="install-yes">INSTALL</button>
    <button id="install-no" class="ghost">×</button>
  </div>

  <!-- Pre-race name entry -->
  <div id="name-entry" class="panel" role="dialog" aria-label="Enter your name">
    <div class="panel-box">
      <div class="panel-title">ENTER NAME</div>
      <input id="name-input" type="text" maxlength="12" autocomplete="off"
             autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="AAA" />
      <div class="panel-row">
        <button id="name-back" class="btn-ghost">BACK</button>
        <button id="name-start" class="btn-go">START</button>
      </div>
    </div>
  </div>

  <!-- Global leaderboard -->
  <div id="leaderboard" class="panel" role="dialog" aria-label="Leaderboard">
    <div class="panel-box">
      <div class="panel-title">🏆 TOP 20</div>
      <div id="lb-status" class="lb-status"></div>
      <div id="lb-list" class="lb-list"></div>
      <div class="panel-row">
        <button id="lb-back" class="btn-go">BACK</button>
      </div>
    </div>
  </div>

  <!-- Game-over action bar -->
  <div id="gameover-actions">
    <button id="go-again" class="btn-go">PLAY AGAIN</button>
    <button id="go-board" class="btn-ghost">LEADERBOARD</button>
    <button id="go-exit" class="btn-ghost">EXIT</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
