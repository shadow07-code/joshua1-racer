<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Joshua 1 — Generate PNG Icons</title>
<style>
  body { font-family: ui-monospace, monospace; background:#0f380f; color:#9bbc0f; padding:20px; }
  button { background:#8bac0f; color:#0f380f; border:2px solid #9bbc0f; padding:8px 12px; font:inherit; font-weight:bold; cursor:pointer; margin:4px; }
  .row { margin: 12px 0; }
  img { image-rendering: pixelated; margin: 4px; background:#9bbc0f; border:2px solid #306230; }
  h1 { margin-top: 0; }
  code { background: #306230; padding: 2px 4px; }
</style>
</head>
<body>
<h1>Joshua 1 — Icon Generator</h1>
<p>This page renders the SVG icons to PNGs at the sizes the PWA manifest expects.
Click each button to download. Save them in <code>icons/</code> alongside the SVGs.</p>

<div class="row">
  <button data-svg="../icons/icon.svg" data-size="192" data-name="icon-192.png">Download icon-192.png</button>
  <button data-svg="../icons/icon.svg" data-size="512" data-name="icon-512.png">Download icon-512.png</button>
  <button data-svg="../icons/icon-maskable.svg" data-size="512" data-name="icon-maskable-512.png">Download icon-maskable-512.png</button>
  <button data-svg="../icons/icon.svg" data-size="180" data-name="apple-touch-icon.png">Download apple-touch-icon.png</button>
</div>

<div id="previews"></div>

<script>
async function svgToPng(svgUrl, size) {
  const res = await fetch(svgUrl);
  const text = await res.text();
  const blob = new Blob([text], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.decoding = "async";
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
    img.src = url;
  });
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0, size, size);
  URL.revokeObjectURL(url);
  return new Promise((resolve) => c.toBlob(resolve, "image/png"));
}

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.querySelectorAll("button[data-svg]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const blob = await svgToPng(btn.dataset.svg, parseInt(btn.dataset.size, 10));
    download(blob, btn.dataset.name);
    const img = document.createElement("img");
    img.src = URL.createObjectURL(blob);
    img.width = Math.min(192, parseInt(btn.dataset.size, 10));
    document.getElementById("previews").appendChild(img);
  });
});
</script>
</body>
</html>
